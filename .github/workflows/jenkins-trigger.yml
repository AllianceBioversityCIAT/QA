name: Trigger Jenkins Job

on:
  push:
    branches:
      - '**'  # Esto ejecutará el flujo en cualquier rama que reciba un push
  workflow_dispatch:  # Esto permite ejecutar manualmente el workflow si es necesario

jobs:
  trigger-job:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Obtener el nombre de la rama y construir la URL para Jenkins
      - name: Get branch name and build Jenkins URL
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}  # Eliminar 'refs/heads/' de GITHUB_REF
          JENKINS_URL="https://automation.prms.cgiar.org/job/qa-application-${BRANCH_NAME}/build"
          echo "Jenkins job URL for the branch $BRANCH_NAME is: $JENKINS_URL"
          echo "JENKINS_URL=${JENKINS_URL}" >> $GITHUB_ENV
        
      # Paso 2: Ejecutar el comando curl para disparar el job en Jenkins con la URL construida dinámicamente
      - name: Trigger Jenkins Job
        run: |
          curl -X POST ${{ env.JENKINS_URL }} --user ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}
        env:
          JENKINS_URL: ${{ env.JENKINS_URL }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}