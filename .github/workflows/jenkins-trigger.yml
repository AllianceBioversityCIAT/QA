name: Trigger Jenkins Job

on:
  push:
    branches:
      - '**'  # Esto ejecutará el flujo en cualquier rama que reciba un push
  workflow_dispatch:  # Esto permite ejecutar manualmente el workflow si es necesario

jobs:
  trigger-job:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Imprimir el nombre de la rama que está ejecutando el job
      - name: Print the branch name
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}  # Eliminar 'refs/heads/' de GITHUB_REF
          echo "The job is being triggered from the branch: $BRANCH_NAME"
        
      # Paso 2: Ejecutar el comando curl para disparar el job en Jenkins
      - name: Trigger Jenkins Job
        run: |
          curl -X POST "https://automation.prms.cgiar.org/job/qa-application-dev/build" --user ${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}
        env:
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
